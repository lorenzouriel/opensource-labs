name: object-storage

services:
  # ------------------------------------------------------------- rustfs
  # S3-compatible object storage (Rust, Apache 2.0 — MinIO alternative).
  rustfs:
    image: rustfs/rustfs:${RUSTFS_VERSION:-latest}
    container_name: rustfs
    security_opt:
      - "no-new-privileges:true"
    ports:
      - "${RUSTFS_API_PORT:-9000}:9000"     # S3 API
      - "${RUSTFS_CONSOLE_PORT:-9001}:9001" # Console UI
    environment:
      RUSTFS_VOLUMES: /data/rustfs{0...3}
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: "*"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?set RUSTFS_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?set RUSTFS_SECRET_KEY in .env}
      RUSTFS_OBS_LOGGER_LEVEL: ${RUSTFS_LOG_LEVEL:-info}
      RUSTFS_OBS_LOG_DIRECTORY: /app/logs
      RUSTFS_UNSAFE_BYPASS_DISK_CHECK: ${RUSTFS_UNSAFE_BYPASS_DISK_CHECK:-true}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - rustfs-data-0:/data/rustfs0
      - rustfs-data-1:/data/rustfs1
      - rustfs-data-2:/data/rustfs2
      - rustfs-data-3:/data/rustfs3
      - rustfs-logs:/app/logs
    mem_limit: ${RUSTFS_MEM_LIMIT:-2g}
    restart: unless-stopped
    depends_on:
      volume-permissions:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:9000/health && curl -fsS http://127.0.0.1:9001/rustfs/console/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - object-storage-network

  # ----------------------------------------------- volume-permissions (init)
  # rustfs runs as uid/gid 10001:10001; named volumes are root-owned until
  # chowned once here. Exits 0 and stays stopped — that's expected.
  volume-permissions:
    image: alpine
    volumes:
      - rustfs-data-0:/data0
      - rustfs-data-1:/data1
      - rustfs-data-2:/data2
      - rustfs-data-3:/data3
      - rustfs-logs:/logs
    command: chown -R 10001:10001 /data0 /data1 /data2 /data3 /logs
    restart: "no"

  # --------------------------------------------------------------- mc (opt)
  # `docker compose --profile client run --rm mc <args>` — S3 CLI against rustfs.
  mc:
    profiles: ["client"]
    image: quay.io/minio/mc:latest
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      MC_HOST_rustfs: http://${RUSTFS_ACCESS_KEY}:${RUSTFS_SECRET_KEY}@rustfs:9000
    entrypoint: ["mc"]
    networks:
      - object-storage-network

networks:
  object-storage-network:
    driver: bridge

volumes:
  rustfs-data-0:
  rustfs-data-1:
  rustfs-data-2:
  rustfs-data-3:
  rustfs-logs:
